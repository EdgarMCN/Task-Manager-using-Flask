name: CI Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:

  test_job:
    name: Testes (pytest / sanity check)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: Run tests
        run: |
          pytest -q || echo "Sem testes estruturados ainda"


  code_analysis:
    name: Code Analysis (flake8)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install flake8
        run: pip install flake8

      - name: Run lint (non-blocking)
        run: |
          flake8 . --count --show-source --statistics || true


  security_scan:
    name: Security Scan (bandit)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install bandit
        run: pip install bandit

      - name: Run security scan
        run: |
          bandit -r . -x ./venv,./env || true


  dependency_check:
    name: Dependency Check (pip-audit)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install pip-audit
        run: pip install pip-audit

      - name: Audit dependencies
        run: |
          pip-audit || true


  build_job:
    name: Build Docker Image
    runs-on: ubuntu-latest
    needs: [test_job]

    steps:
      - uses: actions/checkout@v4

      - name: Build image
        run: docker build -t flask-app:latest .


  deploy_job:
    name: Deploy (docker-compose)
    runs-on: ubuntu-latest
    needs: [build_job]

    steps:
      - uses: actions/checkout@v4

      - name: Start stack
        run: docker compose up -d
