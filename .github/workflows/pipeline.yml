name: Pipeline

on:
push:
branches:
- main
- stage
- develop

pull_request:
branches:
- main
- stage

jobs:

build:

runs-on: ubuntu-latest

steps:

  - name: Checkout do código
    uses: actions/checkout@v4

  - name: Configurar Python
    uses: actions/setup-python@v5
    with:
      python-version: '3.11'

  - name: Instalar dependências
    run: |
      pip install -r requirements.txt

  - name: Verificar sintaxe
    run: |
      python -m py_compile todo_project/run.py

  - name: Testar carregamento da aplicação
    run: |
      python -c "print('Aplicação carregada com sucesso')"
